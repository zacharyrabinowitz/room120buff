{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Step 2: Personal Information</h2>
          <p class="text-center text-muted mb-4">Please complete your details below. All fields are required unless marked optional.</p>

          <form method="POST">
            {% if membership_type == 'corporate' %}
              <div class="mb-4">
                <label for="company_name" class="form-label">Company Name</label>
                <input type="text" class="form-control form-control-lg" id="company_name" name="company_name" required>
              </div>
            {% endif %}

            <div class="row">
              <div class="col-md-6 mb-4">
                <label for="first_name" class="form-label">First Name</label>
                <input type="text" class="form-control form-control-lg" id="first_name" name="first_name" required>
              </div>
              <div class="col-md-6 mb-4">
                <label for="last_name" class="form-label">Last Name</label>
                <input type="text" class="form-control form-control-lg" id="last_name" name="last_name" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="dob" class="form-label">Date of Birth</label>
              <input type="date" class="form-control form-control-lg" id="dob" name="dob" required>
            </div>

            <div class="row">
              <div class="col-md-6 mb-4">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control form-control-lg" id="email" name="email" required>
              </div>
              <div class="col-md-6 mb-4">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control form-control-lg" id="phone" name="phone" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="referred_by" class="form-label">Referred By <span class="text-muted">(Optional)</span></label>
              <input type="text" class="form-control form-control-lg" id="referred_by" name="referred_by">
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="promo_opt_in" name="promo_opt_in" value="1">
              <label class="form-check-label" for="promo_opt_in">
                I would like to receive promotional emails and updates.
              </label>
            </div>

            <div class="d-flex justify-content-between">
              <a href="{{ url_for('apply_step_1') }}" class="btn btn-outline-secondary btn-lg">← Back</a>
              <button type="submit" class="btn btn-primary btn-lg px-4">Continue to Final Step →</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
