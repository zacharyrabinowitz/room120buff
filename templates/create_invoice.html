{% extends 'base.html' %}
{% block content %}
<div class="container-fluid px-4 mt-4">
  <h2 class="mb-4">Create Invoice</h2>

  <form method="POST" action="{{ url_for('submit_invoice') }}">
    <!-- Member Selection -->
    <div class="mb-3">
      <label for="member_id" class="form-label">Select Member</label>
      <select id="member_id" name="member_id" class="form-select" required>
        <option value="">-- Choose a Member --</option>
        {% for member in members %}
          <option value="{{ member.id }}">{{ member.first_name }} {{ member.last_name }} ({{ member.username }})</option>
        {% endfor %}
      </select>
    </div>

    <!-- Editable Auto-Populated Member Info -->
    <div id="member-info" class="mb-4" style="display: none;">
      <h5 class="mb-3">Member Information (Editable)</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">First Name</label>
          <input type="text" class="form-control" id="first_name" name="first_name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-control" id="last_name" name="last_name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Member Number</label>
          <input type="text" class="form-control" id="member_number" name="member_number" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Membership Type</label>
          <input type="text" class="form-control" id="membership_type" name="membership_type" required>
        </div>
      </div>
    </div>

    <!-- Invoice Details -->
    <div id="invoice-fields" style="display: none;">
      <h5 class="mb-3">Invoice Line Items</h5>
      <div id="line-items-container" class="mb-3"></div>
      <button type="button" class="btn btn-info mb-3" onclick="addLineItem()">Add Line Item</button>

      <div class="mb-3">
        <label for="tax" class="form-label">Tax Amount ($)</label>
        <input type="number" step="0.01" class="form-control" name="tax" id="tax" value="0.00" required>
      </div>

      <div class="mb-3">
        <label for="notes" class="form-label">Notes</label>
        <textarea class="form-control" name="notes" rows="3" placeholder="Optional notes..."></textarea>
      </div>

      <button type="submit" class="btn btn-success">Assign Invoice to Member</button>
    </div>
  </form>
</div>

<script>
document.getElementById('member_id').addEventListener('change', function () {
  const memberId = this.value;
  if (memberId) {
    fetch(`/load_member_info/${memberId}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('member-info').style.display = 'block';
        document.getElementById('invoice-fields').style.display = 'block';

        document.getElementById('first_name').value = data.first_name || '';
        document.getElementById('last_name').value = data.last_name || '';
        document.getElementById('email').value = data.email || '';
        document.getElementById('member_number').value = data.member_number || '';
        document.getElementById('membership_type').value = data.membership_type || '';
      });
  } else {
    document.getElementById('member-info').style.display = 'none';
    document.getElementById('invoice-fields').style.display = 'none';
  }
});

function addLineItem() {
  const container = document.getElementById('line-items-container');
  const row = document.createElement('div');
  row.className = 'row mb-2 align-items-center';

  row.innerHTML = `
    <div class="col-md-6">
      <input type="text" name="line_items[]" class="form-control" placeholder="Item description" required>
    </div>
    <div class="col-md-3">
      <input type="number" name="amounts[]" step="0.01" class="form-control" placeholder="Amount" required>
    </div>
    <div class="col-md-3">
      <button type="button" class="btn btn-danger" onclick="this.parentElement.parentElement.remove()">Remove</button>
    </div>
  `;

  container.appendChild(row);
}
</script>
{% endblock %}
