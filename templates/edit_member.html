{% extends "base.html" %}
{% block content %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="form-container">
  <div class="form-card">
    <h2 class="form-header">Edit Member</h2>
    <form method="POST" class="form-grid">

      <div class="form-group">
        <label for="first_name">First Name</label>
        <input type="text" name="first_name" value="{{ member.first_name }}" required>
      </div>

      <div class="form-group">
        <label for="last_name">Last Name</label>
        <input type="text" name="last_name" value="{{ member.last_name }}" required>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" name="username" value="{{ member.username }}" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" name="email" value="{{ member.email }}">
      </div>

      <div class="form-group">
        <label for="member_number">Member Number</label>
        <input type="text" name="member_number" value="{{ member.member_number }}">
      </div>

      <div class="form-group">
        <label for="membership_type">Membership Type</label>
        <select name="membership_type" required>
          <option value="corporate" {% if member.membership_type == 'corporate' %}selected{% endif %}>Corporate</option>
          <option value="single" {% if member.membership_type == 'single' %}selected{% endif %}>Single</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">New Password <small>(Leave blank to keep current password)</small></label>
        <div style="position: relative;">
          <input type="password" name="password" id="password" placeholder="Enter new password if changing">
          <span onclick="togglePassword()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">
            👁️
          </span>
        </div>
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{{ url_for('view_member', user_id=member.id) }}" class="btn btn-secondary">Back to Profile</a>
      </div>

    </form>
  </div>
</div>

<script>
function togglePassword() {
  const passwordInput = document.getElementById('password');
  const isHidden = passwordInput.type === 'password';
  passwordInput.type = isHidden ? 'text' : 'password';
}
</script>
{% endblock %}
