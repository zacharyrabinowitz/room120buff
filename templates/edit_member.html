{% extends "base.html" %}
{% block content %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="container mt-4" style="max-width: 600px;">
  <h2>Edit Member</h2>

  <form method="POST" class="mt-4">

    <!-- First Name -->
    <div class="mb-3">
      <label class="form-label">First Name:</label>
      <input type="text" class="form-control" name="first_name" value="{{ member.first_name }}" required>
    </div>

    <!-- Last Name -->
    <div class="mb-3">
      <label class="form-label">Last Name:</label>
      <input type="text" class="form-control" name="last_name" value="{{ member.last_name }}" required>
    </div>

    <!-- Username -->
    <div class="mb-3">
      <label class="form-label">Username:</label>
      <input type="text" class="form-control" name="username" value="{{ member.username }}" required>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label">Email:</label>
      <input type="email" class="form-control" name="email" value="{{ member.email }}">
    </div>
    
    <!-- Phone -->
    <div class="mb-3">
      <label class="form-label">Phone:</label>
      <input type="text" class="form-control" name="phone" value="{{ member.phone }}">
    </div>  

    <!-- Member Number -->
    <div class="mb-3">
      <label class="form-label">Member Number:</label>
      <input type="text" class="form-control" name="member_number" value="{{ member.member_number }}">
    </div>

    <!-- Membership Type -->
    <div class="mb-3">
      <label class="form-label">Membership Type:</label>
      <select name="membership_type" class="form-select" required>
        <option value="single" {% if member.membership_type == 'single' %}selected{% endif %}>Single</option>
        <option value="corporate" {% if member.membership_type == 'corporate' %}selected{% endif %}>Corporate</option>
      </select>
    </div>

    <!-- New Password -->
    <div class="mb-3 position-relative">
      <label class="form-label">
        New Password <small>(Leave blank to keep current password)</small>
      </label>
      <input type="password" class="form-control" id="editPassword" name="password" placeholder="Enter new password if changing">
      <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer;"
            onclick="togglePassword('editPassword', 'editPasswordEye')">
        <i id="editPasswordEye" class="fas fa-eye"></i>
      </span>
    </div>

    <!-- Buttons -->
    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="{{ url_for('view_member', user_id=member.id) }}" class="btn btn-secondary ms-2">Back to Profile</a>

  </form>
</div>

<script>
function togglePassword(inputId, iconId) {
  const passwordInput = document.getElementById(inputId);
  const eyeIcon = document.getElementById(iconId);
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    eyeIcon.classList.remove('fa-eye');
    eyeIcon.classList.add('fa-eye-slash');
  } else {
    passwordInput.type = 'password';
    eyeIcon.classList.remove('fa-eye-slash');
    eyeIcon.classList.add('fa-eye');
  }
}
</script>

{% endblock %}
