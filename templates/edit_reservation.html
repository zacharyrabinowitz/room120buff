{% extends "base.html" %}
{% block content %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Edit Reservation</h5>
      <a href="{{ url_for('admin_reservations') }}" class="btn btn-light btn-sm">← Back</a>
    </div>
    <div class="card-body">
      <form method="POST">
        <div class="mb-3">
          <label for="date" class="form-label">Date</label>
          <input type="date" class="form-control" id="date" name="date" value="{{ reservation.date.strftime('%Y-%m-%d') }}" required>
        </div>

        <div class="mb-3">
          <label for="time" class="form-label">Time</label>
          <input type="time" class="form-control" id="time" name="time" value="{{ reservation.time.strftime('%H:%M') }}" required>
        </div>

        <div class="mb-3">
          <label for="guests" class="form-label">Number of Guests</label>
          <input type="number" class="form-control" id="guests" name="guests" value="{{ reservation.guests }}" required>
        </div>

        <div class="mb-3">
          <label for="notes" class="form-label">Notes</label>
          <textarea class="form-control" id="notes" name="notes" rows="3">{{ reservation.notes }}</textarea>
        </div>

        <button type="submit" class="btn btn-success">Save Changes</button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
