{% extends "base.html" %}
{% block content %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Manage Events</h2>
    <a href="{{ url_for('events') }}" class="btn btn-secondary">Events</a>
  </div>

  <form method="POST" class="event-form mb-5">
    <div class="form-group">
      <label>Event Name</label>
      <input type="text" name="name" required class="form-control">
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" name="date" required class="form-control">
    </div>
    <div class="form-group">
      <label>Time</label>
      <input type="time" name="time" required class="form-control">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" required class="form-control"></textarea>
    </div>
    <button type="submit" class="btn btn-success mt-2">Add Event</button>
  </form>

  <div class="event-list">
    {% for event in events %}
      <div class="event-card admin">
        <h4>{{ event.name }}</h4>
        <p><strong>Date:</strong> {{ event.date }}</p>
        <p><strong>Time:</strong> {{ event.time.strftime('%I:%M %p') }}</p>
        <p>{{ event.description }}</p>
        <div class="mt-3">
          <a href="{{ url_for('edit_event', event_id=event.id) }}" class="btn btn-primary">Edit</a>
          <form method="POST" action="{{ url_for('delete_event', event_id=event.id) }}" style="display:inline;">
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
        </div>
      </div>
    {% else %}
      <p class="text-muted text-center">No events created yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
