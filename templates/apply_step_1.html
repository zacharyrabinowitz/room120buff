{% extends 'base.html' %}
{% block content %}
<div class="container-fluid px-4 mt-4 mb-5">
  <h2 class="mb-4 text-center">Step 1: Choose Membership Type</h2>

  <form method="POST" class="card shadow p-4">
    <div class="mb-4 text-center">
      <p class="lead">Please select the type of membership you are applying for:</p>
    </div>

    <div class="form-check form-check-inline mb-3">
      <input class="form-check-input" type="radio" name="membership_type" id="individual" value="individual" required>
      <label class="form-check-label" for="individual">Individual Membership</label>
    </div>
    <div class="form-check form-check-inline mb-4">
      <input class="form-check-input" type="radio" name="membership_type" id="corporate" value="corporate" required>
      <label class="form-check-label" for="corporate">Corporate Membership</label>
    </div>

    <div class="text-end">
      <button type="submit" class="btn btn-primary">Continue <i class="fas fa-arrow-right ms-1"></i></button>
    </div>
  </form>
</div>
{% endblock %}
