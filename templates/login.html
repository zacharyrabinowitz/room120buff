﻿<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>Room 120 — Member Login</title>

  <!-- Your full styling pasted from style.css -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <style>
    /* === ROOT VARIABLES, LAYOUT, BACKGROUND, FONTS, ETC. === */
    /* (Everything you provided—unchanged) */

    :root {
      --bg: #050508;
      --bg-elevated: #101018;
      --bg-soft: #151520;
      --border-subtle: #27273a;
      --accent: #f5b45c;
      --accent-soft: rgba(245, 180, 92, 0.14);
      --accent-strong: #ffcf7a;
      --text: #f7f3ea;
      --muted: #a7a0b3;
      --danger: #ff5c73;

      --radius-lg: 18px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 60px rgba(0, 0, 0, 0.7);

      --nav-h: 72px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #141224 0, #050508 55%, #020205 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* === HERO BACKGROUND IMAGE (MATCHES PUBLIC SITE) === */
    .login-bg {
      position: fixed;
      inset: 0;
      background-image: url("{{ url_for('static', filename='assets/room120_hero.jpg') }}");
      background-size: cover;
      background-position: center;
      filter: brightness(0.45) saturate(1.1);
      z-index: -2;
    }

    .login-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(5, 5, 10, 0.85),
        rgba(5, 5, 10, 0.95)
      );
      z-index: -1;
    }

    /* === LOGIN CARD === */
    .login-card {
      width: min(420px, 92%);
      background: rgba(10, 10, 18, 0.88);
      padding: 32px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .login-logo {
      width: 110px;
      height: auto;
      margin-bottom: 18px;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.7));
    }

    h2 {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      margin: 0 0 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* === FORM ELEMENTS (MATCH SITE STYLE) === */
    .form {
      display: grid;
      gap: 14px;
      margin-top: 16px;
    }

    .form input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(4,4,8,0.9);
      color: var(--text);
      padding: 1px;
      font-size: 1rem;
      min-height: 44px; /* required for iPhone */
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(245,180,92,0.5);
    }

    /* Password toggle */
    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: var(--muted);
      user-select: none;
    }

    /* === BUTTONS === */
    .btn {
      margin-top: 10px;
      width: 100%;
      height: 46px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 0.92rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #1a150d;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.7);
    }

    .btn-accent:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

<body>

<div class="login-bg"></div>
<div class="login-overlay"></div>

<div class="login-card">

  <img src="{{ url_for('static', filename='assets/room120_logo.png') }}" class="login-logo" alt="Room 120 Logo">

  <h2>Member Login</h2>

  <form method="POST" class="form">

    <input type="text" name="username" placeholder="Username" required>

    <div class="password-wrapper">
      <input type="password" id="password" name="password" placeholder="Password" required>
      <span class="toggle-password" onclick="togglePassword()"><i id="eye-icon" class="fas fa-eye"></i></span>
    </div>

    <button type="submit" class="btn btn-accent">Login</button>

  </form>

</div>

<script>
function togglePassword() {
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
