{% extends "base.html" %}
{% block content %}

<div class="container-fluid px-4 mt-4">
  <h2 class="text-center mb-4">Edit Event</h2>

  <form method="POST" class="event-form">
    <div class="form-group">
      <label>Event Name</label>
      <input type="text" name="name" value="{{ event.name }}" required class="form-control">
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" name="date" value="{{ event.date }}" required class="form-control">
    </div>
    <div class="form-group">
      <label>Time</label>
      <input type="time" name="time" value="{{ event.time }}" required class="form-control">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" class="form-control" required>{{ event.description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary mt-2">Save Changes</button>
    <a href="{{ url_for('admin_events') }}" class="btn btn-secondary mt-2">Cancel</a>
  </form>
</div>
{% endblock %}
